# Keeps the Render free-tier backend awake by pinging it every 10 minutes.
# Render spins free web services down after 15 min of inactivity.
#
# Setup: Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name:  RENDER_BACKEND_URL
#   Value: https://<your-service>.onrender.com   (no trailing slash, no /api)
#
# Note: GitHub cron can run several minutes late and scheduled workflows are
# auto-disabled after 60 days without repo activity — use UptimeRobot /
# cron-job.org as the primary pinger and treat this as a backup.
name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL secret not set; skipping."
            exit 0
          fi
          # Generous timeout + retries so a cold start (50s–2min) still succeeds.
          curl -fsS --max-time 150 --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/ping" && echo " — backend awake"
